<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jadwal TKA 21–29 Okt</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2530;--muted:#667085;--line:#dfe3e8;--accent:#2f5d8a;--accent-soft:#e3eef8;--ok:#2e7d4f;
--matwa:#2f5d8a;--matlan:#7a4fa3;--bindo:#2e7d4f;--bing:#b8651b;--ujian:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--card:#1d232b;--text:#e8ecf1;--muted:#9aa5b4;--line:#2d3641;--accent:#7fb0e0;--accent-soft:#233447;--ok:#6cc58f;--matwa:#7fb0e0;--matlan:#c3a2e6;--bindo:#6cc58f;--bing:#f0a566;--ujian:#ff8b7d}}
:root[data-theme="dark"]{--bg:#14181d;--card:#1d232b;--text:#e8ecf1;--muted:#9aa5b4;--line:#2d3641;--accent:#7fb0e0;--accent-soft:#233447;--ok:#6cc58f;--matwa:#7fb0e0;--matlan:#c3a2e6;--bindo:#6cc58f;--bing:#f0a566;--ujian:#ff8b7d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:1.3rem;margin:4px 0 2px}
.sub{color:var(--muted);font-size:.88rem;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.85rem;color:var(--muted);margin-bottom:6px}
.row b{color:var(--text)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px}
.chip{flex:0 0 auto;min-width:62px;text-align:center;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:7px 8px;font:inherit;cursor:pointer}
.chip small{display:block;color:var(--muted);font-size:.7rem}
.chip.sel{border-color:var(--accent);background:var(--accent-soft);outline:2px solid var(--accent)}
.chip.done{border-color:var(--ok)}
.chip.today::after{content:"hari ini";display:block;font-size:.62rem;color:var(--accent)}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid currentColor;margin-left:6px;vertical-align:middle}
.task{display:flex;gap:11px;align-items:flex-start;padding:11px 2px;border-top:1px solid var(--line);cursor:pointer}
.task:first-of-type{border-top:0}
.task input{width:24px;height:24px;margin:1px 0 0;flex:0 0 auto;accent-color:var(--ok)}
.task .t{flex:1}
.task .m{font-size:.76rem;color:var(--muted)}
.tag{font-weight:700;font-size:.76rem;margin-right:6px}
.task.checked .t span.x{text-decoration:line-through;color:var(--muted)}
.ujian{border:1px solid var(--ujian);color:var(--ujian);border-radius:10px;padding:8px 10px;font-weight:700;margin-bottom:10px;font-size:.92rem}
textarea{width:100%;min-height:78px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);padding:9px;font:inherit;font-size:.9rem;resize:vertical}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button.s{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:10px;padding:8px 12px;font:inherit;font-size:.82rem;cursor:pointer}
.note{font-size:.82rem;color:var(--muted)}
.done-msg{color:var(--ok);font-weight:700;margin:2px 0 8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Jadwal belajar TKA</h1>
  <p class="sub">Ujian: 26 Okt Matwa · 27 Okt Bing · 28 Okt Bindo · 29 Okt Matlan</p>
  <div class="card">
    <div class="row"><span>Kemajuan seluruh jadwal</span><b id="allpct">0%</b></div>
    <div class="bar"><i id="allbar"></i></div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="card" id="day"></div>
  <div class="card">
    <div class="row"><b>Catatan kesalahan hari ini</b></div>
    <textarea id="note" placeholder="Tulis soal yang salah, penyebabnya, dan rumus atau aturan yang benar."></textarea>
  </div>
  <div class="btns"><button class="s" id="reset">Hapus semua centang</button></div>
  <p class="note">Centang dan catatan tersimpan di perangkat ini. Pada hari ujian jangan belajar materi baru, cukup baca ringkasan dan catatan kesalahan.</p>
</div>
<script>
var COL={Matwa:'var(--matwa)',Matlan:'var(--matlan)',Bindo:'var(--bindo)',Bing:'var(--bing)',Ujian:'var(--ujian)',Umum:'var(--muted)'};
var DAYS=[
{d:21,n:'Rabu',tag:'H-5 Matwa',t:[
['Matwa','Baca Matwa Titik Lemah bagian 1-2 (daerah hasil fungsi, deret geometri)',40],
['Matwa','Kerjakan soal 1-16',45],
['Matwa','Koreksi dan catat kesalahan',25],
['Bing','Latihan Reading Bing soal 1-10',25],
['Bindo','Baca Bindo Titik Lemah bagian 1 (kata serapan)',20],
['Umum','Tidur 7 jam atau lebih',0]]},
{d:22,n:'Kamis',tag:'H-4 Matwa',t:[
['Matwa','Baca bagian 3-4 (bunga, data)',40],
['Matwa','Kerjakan soal 17-30',45],
['Matwa','Koreksi dan catat kesalahan',25],
['Matlan','Baca kisi-kisi Matlan, lalu kerjakan diagnosis Matlan',45],
['Bing','Latihan Reading soal 11-20',25],
['Bindo','Baca bagian 2-3 (kata baku, kalimat efektif)',20],
['Umum','Tidur 7 jam atau lebih',0]]},
{d:23,n:'Jumat',tag:'H-3 Matwa',t:[
['Matwa','SIMULASI Diagnosis Matwa 25 soal, 75 menit, tanpa kalkulator',75],
['Matwa','Koreksi dan tandai topik yang salah',30],
['Matlan','Matriks: determinan, invers, operasi',45],
['Bing','Latihan Reading soal 21-30',25],
['Bindo','Soal 1-20 Bindo Titik Lemah',30],
['Umum','Tidur 7 jam atau lebih',0]]},
{d:24,n:'Sabtu',tag:'H-2 Matwa',t:[
['Matwa','Ulangi topik yang masih salah; kerjakan ulang soal salah',60],
['Matwa','Tulis ringkasan rumus (1 halaman)',30],
['Matlan','Polinomial: operasi, pemfaktoran, suku sisa',45],
['Bindo','Soal 21-40, lalu koreksi seluruh 40 soal',50],
['Bing','Baca ulang tabel strategi tipe soal',15],
['Umum','Tidur 7 jam atau lebih',0]]},
{d:25,n:'Minggu',tag:'H-1 Matwa (ringan)',t:[
['Matwa','Baca ringkasan rumus dan catatan kesalahan; 10 soal campuran yang dulu salah',45],
['Matlan','Vektor: panjang, operasi, hasil kali titik',45],
['Bindo','Baca catatan kesalahan kata baku dan kalimat efektif',15],
['Umum','Siapkan kartu ujian, alat tulis, dan pakaian',10],
['Umum','Tidur sebelum 21.30',0]]},
{d:26,n:'Senin',tag:'UJIAN MATWA',u:'Hari ini ujian Matwa',t:[
['Matwa','Pagi: baca ringkasan rumus saja',20],
['Ujian','Ujian Matwa',0],
['Umum','Makan dan istirahat minimal 1 jam',60],
['Bing','Les Bing, lalu baca strategi dan catatan kesalahan reading',30],
['Matlan','Fungsi: eksponen, logaritma, mutlak, trigonometri',60],
['Umum','Tidur 7 jam atau lebih',0]]},
{d:27,n:'Selasa',tag:'UJIAN BING',u:'Hari ini ujian Bing',t:[
['Bing','Pagi: baca tabel strategi dan pola pengecoh, tanpa soal baru',20],
['Ujian','Ujian Bing',0],
['Umum','Istirahat 1 jam',60],
['Bindo','Ulangi soal yang salah; baca ulang tabel serapan dan kata baku',40],
['Matlan','Lingkaran (persamaan, garis singgung) dan transformasi matriks',75],
['Umum','Tidur 7 jam atau lebih',0]]},
{d:28,n:'Rabu',tag:'UJIAN BINDO',u:'Hari ini ujian Bindo',t:[
['Bindo','Pagi: baca catatan kesalahan serapan, kata baku, kalimat efektif',20],
['Ujian','Ujian Bindo',0],
['Umum','Istirahat 1 jam',60],
['Matlan','Limit (aljabar dan trigonometri)',50],
['Matlan','20 soal campuran Matlan, waktu dibatasi, lalu koreksi',65],
['Umum','Tidur sebelum 21.30',0]]},
{d:29,n:'Kamis',tag:'UJIAN MATLAN',u:'Hari ini ujian Matlan',t:[
['Matlan','Pagi: baca lembar rumus dan catatan kesalahan, tanpa materi baru',30],
['Ujian','Ujian Matlan',0],
['Umum','Selesai. Istirahat dan rayakan.',0]]}
];
var store={};var KEY='tka-jadwal-v1';
try{var raw=localStorage.getItem(KEY);if(raw)store=JSON.parse(raw)||{};}catch(e){store={};}
store.c=store.c||{};store.n=store.n||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
function id(d,i){return d+'-'+i;}
function stat(day){var done=0,mins=0,left=0;day.t.forEach(function(t,i){if(store.c[id(day.d,i)])done++;else left+=t[2];mins+=t[2];});return{done:done,total:day.t.length,left:left};}
var now=new Date(),sel=21,today=null;
if(now.getFullYear()===2026&&now.getMonth()===9&&now.getDate()>=21&&now.getDate()<=29){today=now.getDate();sel=today;}
else if(now.getFullYear()===2026&&now.getMonth()===9&&now.getDate()>29)sel=29;
function fmt(m){if(m<=0)return'selesai';var h=Math.floor(m/60),r=m%60;return(h?h+' jam ':'')+(r?r+' menit':'').trim();}
function render(){
  var tot=0,dn=0;DAYS.forEach(function(d){var s=stat(d);tot+=s.total;dn+=s.done;});
  var p=Math.round(dn/tot*100);document.getElementById('allpct').textContent=p+'% ('+dn+' dari '+tot+')';document.getElementById('allbar').style.width=p+'%';
  var ch=document.getElementById('chips');ch.innerHTML='';
  DAYS.forEach(function(d){var s=stat(d);var b=document.createElement('button');
    b.className='chip'+(d.d===sel?' sel':'')+(s.done===s.total?' done':'')+(d.d===today?' today':'');
    b.innerHTML='<b>'+d.d+' Okt</b><small>'+d.n+' · '+s.done+'/'+s.total+'</small>';
    b.onclick=function(){sel=d.d;render();};ch.appendChild(b);});
  var day=DAYS.filter(function(d){return d.d===sel;})[0];var s=stat(day);
  var h='<div class="row"><span><b>'+day.n+', '+day.d+' Okt</b><span class="badge" style="color:'+(day.u?'var(--ujian)':'var(--accent)')+'">'+day.tag+'</span></span><span>'+s.done+'/'+s.total+'</span></div>';
  h+='<div class="bar"><i style="width:'+Math.round(s.done/s.total*100)+'%"></i></div>';
  h+='<div class="row" style="margin-top:8px"><span>Sisa waktu belajar</span><b>'+fmt(s.left)+'</b></div>';
  if(day.u)h+='<div class="ujian">'+day.u+'. Jangan belajar materi baru.</div>';
  if(s.done===s.total)h+='<div class="done-msg">Semua tugas hari ini selesai.</div>';
  day.t.forEach(function(t,i){var k=id(day.d,i),ck=!!store.c[k];
    h+='<label class="task'+(ck?' checked':'')+'"><input type="checkbox" data-k="'+k+'"'+(ck?' checked':'')+'><span class="t"><span class="tag" style="color:'+COL[t[0]]+'">'+t[0]+'</span><span class="x">'+t[1]+'</span>'+(t[2]?'<div class="m">±'+t[2]+' menit</div>':'')+'</span></label>';});
  var el=document.getElementById('day');el.innerHTML=h;
  Array.prototype.forEach.call(el.querySelectorAll('input'),function(cb){cb.onchange=function(){if(cb.checked)store.c[cb.dataset.k]=1;else delete store.c[cb.dataset.k];save();render();};});
  var ta=document.getElementById('note');ta.value=store.n[sel]||'';
}
document.getElementById('note').oninput=function(){store.n[sel]=this.value;save();};
document.getElementById('reset').onclick=function(){if(confirm('Hapus semua centang? Catatan kesalahan tetap tersimpan.')){store.c={};save();render();}};
render();
</script>
</body>
</html>
